<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DPS</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js"></script>
</head>
<body>
  <header><h1>DPS</h1></header>
  <nav>
    <a class="tab" href="damage-result.html">造成傷害結果</a>
    <a class="tab" href="taken.html">承受傷害</a>
    <a class="tab" href="taken-result.html">承受結果</a>
    <a class="tab" href="dps.html">DPS</a>
  </nav>

  <main class="grid">
    <section class="panel col-12">
      <div class="formula">
DPS規則:
普通攻擊(平均表現): 100% / 秒
重擊: 一秒 4 點能量，每點能量 10% 傷害 = 40% / 秒
技能: 一秒 3 點MP，每點MP 20% 傷害 = 60% / 秒
      </div>
    </section>

    <section class="card col-6">
      <h3>輸入</h3>
      <div class="row"><label for="dpsN">普通攻擊 %/秒</label><input id="dpsN" type="number" step="0.01" value="100"></div>
      <div class="row"><label for="dpsH">重擊 %/秒</label><input id="dpsH" type="number" step="0.01" value="40"></div>
      <div class="row"><label for="dpsS">技能 %/秒</label><input id="dpsS" type="number" step="0.01" value="60"></div>
      <div style="margin-top:10px; display:flex; gap:12px">
        <button type="button" onclick="
          calcDPS();
          out.textContent = localStorage.getItem('dps_result_value') || '0';
          const o = JSON.parse(localStorage.getItem('dps_breakdown')||'{}');
          detail.textContent = o ? `普通=${o.normal}，重擊=${o.heavy}，技能=${o.skill}` : '';
        ">計算</button>
      </div>
    </section>

    <section class="card col-6">
      <h3>結果</h3>
      <div id="out" class="value">0</div>
      <div id="detail" class="box"></div>
    </section>
  </main>

  <footer>琳琳出品</footer>
</body>
</html>
